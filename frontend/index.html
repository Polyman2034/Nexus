<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A simple full-stack task manager"
    >

    <title>Task Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->

        <header class="header">
            <h1>Task Manager</h1>

            <p>
                Manage your tasks efficiently.
            </p>
        </header>


        <!-- Add Task -->

        <section class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                maxlength="100"
            >

            <button id="addButton">
                Add Task
            </button>

        </section>


        <!-- Task Statistics -->

        <section class="stats">

            <div class="stat">
                <span id="totalTasks">0</span>
                <small>Total</small>
            </div>

            <div class="stat">
                <span id="activeTasks">0</span>
                <small>Active</small>
            </div>

            <div class="stat">
                <span id="completedTasks">0</span>
                <small>Completed</small>
            </div>

        </section>


        <!-- Filters -->

        <nav class="filters">

            <button
                class="filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="active"
            >
                Active
            </button>

            <button
                class="filter"
                data-filter="completed"
            >
                Completed
            </button>

        </nav>


        <!-- Task List -->

        <section>

            <ul id="taskList"></ul>

            <p
                id="emptyMessage"
                class="empty-message"
            >
                No tasks yet.
            </p>

        </section>

    </main>


    <script src="js/main.js"></script>

</body>

</html>
